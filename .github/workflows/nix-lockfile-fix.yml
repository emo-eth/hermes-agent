name: Nix Lockfile Fix

on:
  push:
    branches: [main]
    paths:
      - 'ui-tui/package-lock.json'
      - 'ui-tui/package.json'
      - 'web/package-lock.json'
      - 'web/package.json'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to fix (leave empty to run on the selected branch)'
        required: false
        type: string
  issue_comment:
    types: [edited]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: nix-lockfile-fix-${{ github.event.issue.number || github.event.inputs.pr_number || github.ref }}
  cancel-in-progress: false

jobs:
  # ── Auto-fix on main ───────────────────────────────────────────────
  # Fires when a push to main touches package.json or package-lock.json
  # in ui-tui/ or web/. Runs fix-lockfiles and pushes the hash
  # update commit directly to main so Nix builds never stay broken.
  #
  # Safety invariants:
  #   1. The fix commit only touches nix/*.nix files, which are NOT in
  #      the paths filter above, so this cannot re-trigger itself.
  #   2. An explicit file-whitelist check before commit aborts if
  #      fix-lockfiles ever modifies unexpected files.
  #   3. Job-level concurrency with cancel-in-progress: true ensures
  #      back-to-back pushes collapse to the newest; ref: main checkout
  #      always operates on the latest branch state.
  #   4. Uses a GitHub App token (not GITHUB_TOKEN) so the fix commit
  #      triggers downstream nix.yml verification.
  auto-fix-main:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: auto-fix-main
      cancel-in-progress: true
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@7bfa3a4717ef143a604ee0a99d859b8886a96d00  # v1.9.3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - uses: ./.github/actions/nix-setup
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Apply lockfile hashes
        id: apply
        run: nix run .#fix-lockfiles -- --apply

      - name: Commit & push
        if: steps.apply.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          # Ensure only nix files were modified — prevents accidental
          # self-triggering if fix-lockfiles ever touches package files.
          unexpected="$(git diff --name-only | grep -Ev '^nix/(tui|web)\.nix$' || true)"
          if [ -n "$unexpected" ]; then
            echo "::error::Unexpected modified files: $unexpected"
            exit 1
          fi

          # Record the base SHA before committing — used to detect package
          # file changes if we need to rebase after a non-fast-forward push.
          BASE_SHA="$(git rev-parse HEAD)"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nix/tui.nix nix/web.nix
          git commit -m "fix(nix): auto-refresh npm lockfile hashes" \
            -m "Source: $GITHUB_SHA" \
            -m "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          # Retry push with rebase in case main advanced with an unrelated
          # commit during the nix build. Without this, a non-fast-forward
          # rejection silently loses the fix. If package files changed during
          # the rebase, abort — a fresh auto-fix run will handle the new state.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "::warning::Push attempt $attempt failed (non-fast-forward?), rebasing…"
            git fetch origin main

            # If package files changed between our base and the new main,
            # our computed hashes are stale. Abort and let the next triggered
            # run recompute from the correct package-lock state.
            pkg_changed="$(git diff --name-only "$BASE_SHA"..origin/main -- \
              'ui-tui/package-lock.json' 'ui-tui/package.json' \
              'web/package-lock.json' 'web/package.json' || true)"
            if [ -n "$pkg_changed" ]; then
              echo "::warning::Package files changed since hash computation — aborting; a fresh run will recompute"
              exit 0
            fi

            git rebase origin/main
          done
          echo "::error::Failed to push after 3 rebase attempts"
          exit 1

  # ── PR fix (manual / checkbox) ─────────────────────────────────────
  # Existing behavior: run on manual dispatch OR when a task-list
  # checkbox in the sticky lockfile-check comment flips from [ ] to [x].
  #
  # Security boundary: PR-controlled Nix code runs only in fix-generate,
  # without GitHub tokens/cache write secrets. The privileged push happens in
  # fix-push, a separate job that downloads only the two generated lockfile
  # artifacts into a fresh trusted checkout of the pinned PR head SHA.
  fix-generate:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment'
       && github.event.issue.pull_request != null
       && contains(github.event.comment.body, '[x] **Apply lockfile fix**')
       && !contains(github.event.changes.body.from, '[x] **Apply lockfile fix**'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.apply.outputs.changed }}
      ref: ${{ steps.resolve.outputs.ref }}
      repo: ${{ steps.resolve.outputs.repo }}
      owner: ${{ steps.resolve.outputs.owner }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
      pr: ${{ steps.resolve.outputs.pr }}
    steps:
      - name: Authorize & resolve PR
        id: resolve
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7.0.1
        with:
          script: |
            // 1. Verify the actor has write access — applies to both checkbox
            //    clicks and manual dispatch.
            const { data: perm } =
              await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: context.actor,
              });
            if (!['admin', 'write', 'maintain'].includes(perm.permission)) {
              core.setFailed(
                `${context.actor} lacks write access (has: ${perm.permission})`
              );
              return;
            }

            // 2. Resolve which ref to check out.
            let prNumber = '';
            if (context.eventName === 'issue_comment') {
              prNumber = String(context.payload.issue.number);
            } else if (context.eventName === 'workflow_dispatch') {
              prNumber = context.payload.inputs.pr_number || '';
            }

            if (!prNumber) {
              core.setOutput('ref', context.ref.replace(/^refs\/heads\//, ''));
              core.setOutput('repo', context.repo.repo);
              core.setOutput('owner', context.repo.owner);
              core.setOutput('head_sha', context.sha);
              core.setOutput('pr', '');
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(prNumber),
            });
            core.setOutput('ref', pr.head.ref);
            core.setOutput('repo', pr.head.repo.name);
            core.setOutput('owner', pr.head.repo.owner.login);
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('pr', String(pr.number));

      - name: Checkout untrusted PR head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          repository: ${{ steps.resolve.outputs.owner }}/${{ steps.resolve.outputs.repo }}
          ref: ${{ steps.resolve.outputs.head_sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: untrusted-pr-head

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - uses: cachix/cachix-action@1eb2ef646ac0255473d23a5907ad7b04ce94065c # v17
        with:
          name: hermes-agent
        continue-on-error: true

      - name: Apply lockfile hashes in untrusted checkout
        id: apply
        working-directory: untrusted-pr-head
        env:
          GITHUB_TOKEN: ''
          GH_TOKEN: ''
        run: nix run .#fix-lockfiles

      - name: Validate generated lockfile artifacts
        if: steps.apply.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for file in nix/tui.nix nix/web.nix; do
            if [ ! -f "untrusted-pr-head/$file" ] || [ -L "untrusted-pr-head/$file" ]; then
              echo "::error::Refusing unsafe lockfile path: $file"
              exit 1
            fi
          done
          mkdir -p lockfile-artifacts/nix
          cp untrusted-pr-head/nix/tui.nix lockfile-artifacts/nix/tui.nix
          cp untrusted-pr-head/nix/web.nix lockfile-artifacts/nix/web.nix
          tar -C lockfile-artifacts -cf nix-lockfile-fix-outputs.tar nix/tui.nix nix/web.nix

      - name: Upload lockfile artifacts
        if: steps.apply.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: nix-lockfile-fix-outputs
          if-no-files-found: error
          path: nix-lockfile-fix-outputs.tar


  fix-current:
    needs: fix-generate
    if: needs.fix-generate.outputs.changed == 'false' && needs.fix-generate.outputs.pr != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Update sticky (already current)
        uses: marocchino/sticky-pull-request-comment@52423e01640425a022ef5fd42c6fb5f633a02728  # v2.9.1
        with:
          header: nix-lockfile-check
          number: ${{ needs.fix-generate.outputs.pr }}
          message: |
            ### ✅ Lockfile hashes already current

            Nothing to commit — [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

  fix-push:
    needs: fix-generate
    if: needs.fix-generate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout trusted push workspace
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          repository: ${{ needs.fix-generate.outputs.owner }}/${{ needs.fix-generate.outputs.repo }}
          ref: ${{ needs.fix-generate.outputs.head_sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: trusted-push

      - name: Download generated lockfile artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: nix-lockfile-fix-outputs
          path: generated-lockfiles

      - name: Copy reviewed lockfile outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p generated-lockfiles/extracted
          tar_listing="$(tar -tf generated-lockfiles/nix-lockfile-fix-outputs.tar | sort)"
          if [ "$tar_listing" != $'nix/tui.nix\nnix/web.nix' ]; then
            echo "::error::Unexpected lockfile artifact contents: $tar_listing"
            exit 1
          fi
          tar -C generated-lockfiles/extracted -xf generated-lockfiles/nix-lockfile-fix-outputs.tar
          for file in nix/tui.nix nix/web.nix; do
            if [ ! -f "generated-lockfiles/extracted/$file" ] || [ -L "generated-lockfiles/extracted/$file" ] || \
               [ ! -f "trusted-push/$file" ] || [ -L "trusted-push/$file" ]; then
              echo "::error::Refusing unsafe lockfile path: $file"
              exit 1
            fi
          done
          cp generated-lockfiles/extracted/nix/tui.nix trusted-push/nix/tui.nix
          cp generated-lockfiles/extracted/nix/web.nix trusted-push/nix/web.nix

      - name: Commit & push from trusted checkout
        shell: bash
        env:
          TARGET_REF: ${{ needs.fix-generate.outputs.ref }}
        run: |
          set -euo pipefail
          cd trusted-push
          EXPECTED_HEAD_SHA="${{ needs.fix-generate.outputs.head_sha }}"
          CURRENT_HEAD_SHA="$(git rev-parse HEAD)"
          if [ "$CURRENT_HEAD_SHA" != "$EXPECTED_HEAD_SHA" ]; then
            echo "::error::HEAD changed before push: expected $EXPECTED_HEAD_SHA, got $CURRENT_HEAD_SHA"
            exit 1
          fi

          unexpected="$(git diff --name-only | grep -Ev '^nix/(tui|web)\.nix$' || true)"
          if [ -n "$unexpected" ]; then
            echo "::error::Unexpected modified files: $unexpected"
            exit 1
          fi

          git reset --mixed HEAD
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nix/tui.nix nix/web.nix
          staged_unexpected="$(git diff --cached --name-only | grep -Ev '^nix/(tui|web)\.nix$' || true)"
          if [ -n "$staged_unexpected" ]; then
            echo "::error::Unexpected staged files: $staged_unexpected"
            exit 1
          fi
          git -c core.hooksPath=/dev/null commit -m "fix(nix): refresh npm lockfile hashes"
          if [[ ! "$TARGET_REF" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "::error::Unsafe PR head ref: $TARGET_REF"
            exit 1
          fi
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ needs.fix-generate.outputs.owner }}/${{ needs.fix-generate.outputs.repo }}.git"
          git -c core.hooksPath=/dev/null push origin "HEAD:${TARGET_REF}"

      - name: Update sticky (applied)
        if: needs.fix-generate.outputs.pr != ''
        uses: marocchino/sticky-pull-request-comment@52423e01640425a022ef5fd42c6fb5f633a02728  # v2.9.1
        with:
          header: nix-lockfile-check
          number: ${{ needs.fix-generate.outputs.pr }}
          message: |
            ### ✅ Lockfile fix applied

            Pushed a commit refreshing the npm lockfile hashes — [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

      - name: Update sticky (push failed)
        if: failure() && needs.fix-generate.outputs.pr != ''
        uses: marocchino/sticky-pull-request-comment@52423e01640425a022ef5fd42c6fb5f633a02728  # v2.9.1
        with:
          header: nix-lockfile-check
          number: ${{ needs.fix-generate.outputs.pr }}
          message: |
            ### ❌ Lockfile fix failed

            See the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for logs.
